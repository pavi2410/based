[workspace]
members = [
    "apps/desktop",
    "crates/based-core",
    "crates/based-mongo",
    "crates/based-postgres",
    "crates/based-project",
    "crates/based-query",
    "crates/based-sqlite",
    "crates/based-ssh",
    "crates/based-storage",
    "crates/based-workspace",
]
resolver = "3"

# GPUI Kit pins matching GPUI (`gpui-pre`) + component/base/assets. Desktop lists
# this crate only — never GPUI itself. See https://gpui-kit.com/docs/installation/
[workspace.dependencies]
gpui-kit = { version = "0.6", features = ["tree-sitter-sql"] }

# Common third-party
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
time = { version = "0.3", features = ["serde-well-known"] }
notify = "7"
toml = "0.8"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "sqlite",
    "postgres",
    "time",
    "tls-rustls",
] }
futures = "0.3"
rand = "0.9"
dirs = "6"
tempfile = "3"
rfd = "0.15"
mongodb = { version = "2", features = ["tokio-runtime"] }
russh = "0.54"

[workspace.lints.clippy]
# Upgrade all default-warn groups to errors.
# priority = -1 so individual allow-overrides in member crates take precedence.
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "deny", priority = -1 }
style       = { level = "deny", priority = -1 }
complexity  = { level = "deny", priority = -1 }
perf        = { level = "deny", priority = -1 }
# Prefer `use` imports over long qualified paths (default max 2 segments).
absolute_paths = "deny"
# SQLx row tuples and other non-GPUI code legitimately produces complex types
type_complexity = "allow"

# Fast incremental rebuilds of workspace crates; UI/text/layout deps fully optimized.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-base = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
usvg = { opt-level = 3 }
tiny-skia = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
cosmic-text = { opt-level = 3 }
swash = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
tree-sitter = { opt-level = 3 }
ropey = { opt-level = 3 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
