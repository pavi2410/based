name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (fmt + clippy + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # GHA images point apt at mirror+file:/etc/apt/apt-mirrors.txt with
      # azure.archive.ubuntu.com as priority:1. That host often hangs instead of
      # failing, so sed on sources.list is a no-op. Rewrite the mirror list.
      # https://github.com/actions/runner-images/issues/7048
      # https://github.com/actions/runner-images/blob/main/images/ubuntu/scripts/build/configure-apt-sources.sh
      - name: Prefer Ubuntu archive over Azure apt mirror
        run: |
          printf '%s\n' \
            $'http://archive.ubuntu.com/ubuntu/\tpriority:1' \
            $'http://security.ubuntu.com/ubuntu/\tpriority:2' \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          # Bound stalls; default Acquire timeouts can sit for hours.
          printf '%s\n' \
            'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' \
            'Acquire::Retries "2";' \
            | sudo tee /etc/apt/apt.conf.d/99-gha-timeouts >/dev/null

      - name: Install Linux dependencies
        run: |
          curl -fsSL https://raw.githubusercontent.com/zed-industries/zed/main/script/linux -o /tmp/zed-linux-deps.sh
          bash /tmp/zed-linux-deps.sh

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

      - name: Build desktop
        run: cargo build -p desktop

  # Linux CI never type-checks `#[cfg(windows)]`. The release matrix does, so
  # SSH-agent Windows APIs have to be checked here or they only fail on Release.
  windows:
    name: rust (windows check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Check desktop
        run: cargo check -p desktop
